# Local dev infra: Postgres (stand-in for Supabase local) + Redis (only needed if
# the backend is configured for Celery instead of the default in-process APScheduler).
# Point `SUPABASE_URL` / `SUPABASE_SERVICE_ROLE_KEY` at a real Supabase project for
# anything beyond raw Postgres access (Auth, RLS) — this compose file does not
# emulate Supabase Auth.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachflow
      POSTGRES_PASSWORD: coachflow
      POSTGRES_DB: coachflow
    ports:
      - "5432:5432"
    volumes:
      - coachflow-postgres-data:/var/lib/postgresql/data
      - ../backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - celery # only started when the backend is configured for Celery + Redis

volumes:
  coachflow-postgres-data:
