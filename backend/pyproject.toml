[project]
name = "coachflow-backend"
version = "0.1.0"
description = "CoachFlow orchestrator: Google Workspace integrations, Gemini-assembled drafts, human-in-the-loop send."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-api-python-client>=2.140",
    "google-auth>=2.32",
    "google-auth-oauthlib>=1.2",
    "google-generativeai>=0.7",
    "supabase>=2.5",
    "apscheduler>=3.10",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-jose>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends(...) in argument defaults is the documented DI
# idiom, not the footgun this rule is designed to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
# supabase-py and google-api-python-client ship no type stubs, so their
# return values erase to Any/JSON-union under strict mode — that produces
# noise (dozens of indexing/mapping errors), not real bugs, everywhere the
# app reads a Supabase row or calls a Google client. Loosen strict's
# any-leakage checks globally rather than sprinkling type: ignore at every
# call site; disallow_untyped_defs etc. stay on so our own code is still held
# to strict.
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "apscheduler.*", "google.generativeai.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# google-auth's Credentials.refresh()/__init__ are themselves untyped even
# though the package ships stubs for the rest of its surface — the override
# targets our modules that call into it, since disallow_untyped_calls is
# checked at the call site, not inside the (third-party) callee's module.
module = ["app.integrations.google.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
